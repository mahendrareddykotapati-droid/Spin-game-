<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Spin Challenge</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- SETUP SCREEN -->

    <div id="setupScreen" class="screen">

        <h1>🎡 Spin Challenge</h1>

        <p>How many people are playing?</p>

        <input
            type="number"
            id="participantCount"
            min="2"
            max="100"
            value="10"
        >

        <button onclick="createWheel()">
            CREATE WHEEL
        </button>

        <p class="info">
            Each person takes one number.
        </p>

    </div>


    <!-- GAME SCREEN -->

    <div id="gameScreen" class="screen hidden">

        <h1>🎡 Spin Challenge</h1>

        <div class="wheel-container">

            <!-- FIXED RED POINTER -->

            <div class="pointer">▼</div>

            <!-- WHEEL -->

            <canvas id="wheel"></canvas>

        </div>

        <button
            id="spinButton"
            onclick="spinWheel()">
            🎡 SPIN
        </button>

        <div id="result"></div>

        <button
            class="reset-button"
            onclick="resetGame()">
            🔄 RESET
        </button>

    </div>


    <script src="script.js"></script>

</body>

</html>
