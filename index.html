<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spin Challenge</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🎡 Spin Challenge</h1>

        <p>Enter number of participants</p>

        <input
            type="number"
            id="participantCount"
            min="2"
            max="30"
            value="7"
        >

        <button onclick="createParticipants()">
            CREATE
        </button>

        <div id="participants"></div>

        <button
            id="startGameButton"
            onclick="startGame()"
            style="display: none;"
        >
            🚀 START GAME
        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
