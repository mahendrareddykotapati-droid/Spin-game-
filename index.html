<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Spin Challenge</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Courgette&display=swap"
          rel="stylesheet">
</head>

<body>

    <div class="container">

        <!-- HEADER -->
        <div class="header">
            <div class="title">
                🎡
                <span>Spin Challenge</span>
            </div>

            <p>Spin the wheel and find your lucky number!</p>
        </div>


        <!-- PARTICIPANT BOX -->
        <div class="control-box">

            <label for="participantCount">
                Number of Participants
            </label>

            <input
                type="number"
                id="participantCount"
                min="2"
                max="100"
                value="16"
            >

            <button id="createWheelBtn">
                Create Wheel
            </button>

        </div>


        <!-- WHEEL AREA -->
        <div class="wheel-container">

            <!-- FIXED POINTER -->
            <div class="pointer"></div>

            <!-- WHEEL -->
            <canvas id="wheelCanvas"
                    width="600"
                    height="600">
            </canvas>

            <!-- CENTER -->
            <div class="center-circle"></div>

        </div>


        <!-- SPIN BUTTON -->
        <button id="spinBtn" class="spin-button">
            SPIN
        </button>


        <!-- RESULT -->
        <div class="result-box">
            🏆
            <span id="resultText">
                Lucky Number: -
            </span>
        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
