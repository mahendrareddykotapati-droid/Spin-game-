<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spin Challenge</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Website Title -->
        <h1>🎡 Spin Challenge</h1>

        <p class="subtitle">
            Spin the wheel and find your lucky number!
        </p>


        <!-- Participant Input -->
        <div class="input-section">

            <label for="participantCount">
                Number of Participants
            </label>

            <input
                type="number"
                id="participantCount"
                min="2"
                max="100"
                placeholder="Enter 2 - 100"
            >

            <button id="createWheelBtn">
                Create Wheel
            </button>

        </div>


        <!-- Wheel Section -->
        <div id="gameSection" class="game-section">

            <div class="wheel-container">

                <!-- Red Needle -->
                <div class="needle"></div>


                <!-- Wheel -->
                <div id="wheel" class="wheel">

                    <!-- Customized Wheel Image -->
                    <img
                        src="images/wheel.png"
                        class="wheel-image"
                        alt="Spin Challenge Wheel"
                    >

                    <!-- Participant Numbers -->
                    <div id="numbersContainer"></div>

                </div>


                <!-- Center Circle -->
                <div class="center-circle"></div>

            </div>


            <!-- Spin Button -->
            <button
                id="spinBtn"
                class="spin-btn"
            >
                SPIN
            </button>


            <!-- Winner Result -->
            <div
                id="result"
                class="result"
            >
                Winner will appear here
            </div>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
